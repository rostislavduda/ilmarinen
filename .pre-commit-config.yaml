# Pre-commit hooks. Activate locally once with:  pre-commit install
# Run against the whole tree on demand with:      pre-commit run --all-files
#
# NOTE: the ruff hooks below are intentionally left un-installed until the
# existing tree has been reviewed (see the report-only lint job in CI). Enable
# them by running `pre-commit install` after the first clean-up pass.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Linter (report-only for now: no --fix, so it never rewrites your code).
      - id: ruff-check
      # Formatter. Left here for when you opt in; it WILL reformat on commit.
      - id: ruff-format

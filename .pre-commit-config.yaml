# Pre-commit hooks. Activate locally once with:  pre-commit install
# Run against the whole tree on demand with:      pre-commit run --all-files
#
# The tree is lint-clean under the configured rule set, so these are ready to
# enable. Install pre-commit into your env first (it is in the `dev` extra):
#   pip install -e ".[dev]" && pre-commit install
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: debug-statements
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Lint — matches the enforced CI rule set. No --fix, so it never rewrites code.
      - id: ruff-check
      # Formatter deferred (whole-repo reformat not adopted). Uncomment to enable:
      # - id: ruff-format

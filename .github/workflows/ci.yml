name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported interpreters (README: "Python 3.11 or 3.12 recommended").
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the install small and fast (no CUDA payload).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Core runtime the unit suite imports (numpy, scipy) plus the guarded
          # progress-bar dep (tqdm). Heavy dataset extras are lazily imported and
          # not exercised by tests_unit/, so they are intentionally omitted.
          pip install "numpy>=1.26,<3" "scipy>=1.11" "tqdm>=4.60"
          pip install -r requirements-dev.txt

      - name: Show environment
        run: |
          python --version
          python -c "import numpy, scipy, torch; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('torch', torch.__version__)"

      - name: Run unit tests
        # `python -m pytest` (not the bare `pytest` console script) puts the repo
        # root on sys.path, so the in-place `ilmarinen` package imports without an
        # install. Matches the documented invocation in the README.
        run: python -m pytest tests_unit/ -v

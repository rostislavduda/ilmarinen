name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # Fast per-interpreter check on every push/PR: the slower @pytest.mark.smoke
    # end-to-end fits are deferred to the nightly workflow. NOTE: the job name is a
    # required status check in branch protection — keep it stable.
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the install small and fast (no CUDA payload).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=1.26,<3" "scipy>=1.11" "tqdm>=4.60"
          pip install -r requirements-dev.txt

      - name: Show environment
        run: |
          python --version
          python -c "import numpy, scipy, torch; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('torch', torch.__version__)"

      - name: Run unit tests (fast subset)
        run: python -m pytest tests_unit/ -m "not smoke" -v

  coverage:
    # Full suite (incl. smoke) on the primary interpreter, with coverage measured
    # and uploaded to Codecov. Not a required check (report/threshold-free for now).
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=1.26,<3" "scipy>=1.11" "tqdm>=4.60"
          pip install -r requirements-dev.txt pytest-cov

      - name: Run full suite with coverage
        run: python -m pytest tests_unit/ --cov=ilmarinen --cov-report=xml --cov-report=term-missing | tee coverage.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage (ilmarinen)'
            echo '```'
            tail -n 25 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true   # never fail CI on an upload hiccup
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}  # optional; tokenless works for public repos
          fail_ci_if_error: false

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.0

      # Enforced: the tree is clean and consistently formatted under pyproject.toml.
      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .
